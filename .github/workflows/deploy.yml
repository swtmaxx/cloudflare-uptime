name: Deploy Cloudflare Uptime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure D1 database exists
        run: node scripts/ensure-d1.mjs
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cloudflare-uptime-db --remote
      - run: npm run build
      - name: Deploy Worker
        run: npx wrangler deploy
